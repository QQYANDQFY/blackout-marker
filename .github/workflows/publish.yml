name: Publish to Modrinth

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -name 'blackout-marker-*.jar' -print -quit)"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: nYt1OhlA
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: dist/blackout-marker-*.jar

          name: Blackout Marker ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release

          loaders: fabric
          game-versions: 26.3

          dependencies: |
            fabric-api | required | 0.161.0+26.3

          changelog: |
            Initial release for Minecraft 26.3.

            - Entity, block, tag, manual target selection
            - Any-part/center visibility and optional occlusion hiding
            - Per-target sizes and visibility/occlusion overrides
            - Multiple fixed-direction markers with per-marker sizes
            - Sun/moon markers with individual sizes
            - AI-assisted development; human-reviewed, compiled, and tested

            Licensed under LGPL-3.0-only.
