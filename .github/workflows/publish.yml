name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -name 'blackout-marker-*.jar' -print -quit)"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: blackout-marker
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: dist/blackout-marker-*.jar

          name: Blackout Marker ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release

          loaders: fabric
          game-versions: 26.3

          dependencies: |
            fabric-api | required | 0.161.0+26.3

          changelog: ${{ github.event.release.body }}
